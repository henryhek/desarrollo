<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Diseñado por Hely.com.co para Mujeres Rompiendo Barreras">
    <link rel="icon" type="image/png" href="https://hely.com.co/consultoria/assets/img/favicon.png">
    <title>Match | Mujeres Rompiendo Barreras</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="description" content="Match Mentee - Mentora de Mujeres Rompiendo Barreras 2024. Diseñado por Hely.com.co.">
    <meta property="og:title" content="Match | Mujeres Rompiendo Barreras">
    <meta property="og:description" content="Match Mentee - Mentora de Mujeres Rompiendo Barreras 2024. Diseñado por Hely.com.co.">
    <meta property="og:image" content="https://hely.com.co/mrb/redes.png">


    <style>
        /* Estilos de la paginación */
    </style>
</head>

<body>


    <style>
        .logo {
            width: 10rem;
        }

        .container-match {
            width: 90%;
        }

        .card {
            width: 13rem;
            height: 17rem;
        }


        .card-container {
            flex-wrap: wrap;
            width: 90%;
            padding-bottom: 2rem;
        }

        .card h3.nombres {
            height: 40px;
            font-size: .9rem;
        }

        .mentora h3.nombres {
            background-color: #0097A1;
        }

        .card.mentora .video-button {
            display: none;
        }

        .pareja {
            display: flex;
            flex-direction: row;
        }

        .card.mentora {
            border-radius: 20px 0px 0px 20px !important;
        }

        .card.mentee {
            border-radius: 0px 20px 20px 0px !important;
        }


        @media (max-width:1920px) {
            .card {
                width: 7rem;
                height: 10rem;
            }

            .card h3.nombres {
                height: 35px;
                font-size: .8rem;
            }
        }

        @media (max-width:768px) {

            .logo-mrb {
                position: relative;
                right: unset;
                top: unset;
                padding-top: 2rem;
            }

            .logo-match {
                position: relative;
                left: unset;
                top: unset;
            }

            .logo {
                width: 7rem;
            }

            .card {
                width: 11rem;
                height: 14rem;
            }
        }

        .bg-image {
            width: 100%;
            height: 16rem;
            background-size: cover;
            background-position: center;
            border-radius: 8px;
        }

        .bg-morado {
            width: 100%;
            position: absolute;
            z-index: -1;
            bottom: 0;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }

        .pagination button {
            padding: 0.5rem 1rem;
            font-size: 1rem;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .pagination button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
    <div id="image-preload" style="display: none;"></div>


    <!-- Contenido centrado -->

    <main>
        <div class="logo-mrb"><img src="mrb-blanco.png" class="logo" alt="">
        </div>
        <div class="logo-match"><img src="img/match.svg" class="logo" alt="">
        </div>

        <div class="container-match">
            <div class="card-container" id="card-container">
                <!-- Las cartas se generarán automáticamente aquí -->
            </div>
            <!-- Paginación -->
            <div class="pagination" id="pagination-container">
                <!-- Los botones de paginación se generarán automáticamente aquí -->
                <button id="previous-page">Anterior</button>
                <button id="next-page">Siguiente</button>
            </div>
        </div>
        <button id="verSaludoBtn" style="display: none;">Ver Saludo</button>

        <div class="bg-morado">
            <img src="img/fondo-morado.svg" alt="">
        </div>
    </main>
    <div id="modal" class="modal">
        <div class="modal-content">
            <span id="close-modal" class="close">&times;</span>
            <iframe id="video-modal" width="560" height="315" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Scripts para partículas y generación de cartas -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>


    </script>
    <script src="js/script.js"></script>
    <script src="js/collageCards.js"></script>
</body>

</html>
