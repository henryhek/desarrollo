<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cumpleaños Team | Amigos del Trabajo</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800;900&display=swap" rel="stylesheet">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
	<style>
		:root {
			--team-azul: #1f4b70;
			--team-coral: #ff6b5f;
			--team-menta: #2fbf9f;
			--team-menta-dark: #23967d;
			--team-texto: #1b2430;
			--team-gris: #e4e8ee;
			--team-fondo: #f6f8fb;
			--page-bg-1: #fffdf9;
			--page-bg-2: #f7f8fc;
			--page-bg-3: #eef2f8;
			--poster-start: #fffefc;
			--poster-end: #f9fbff;
			--poster-glow-rgb: 47, 191, 159;
			--poster-glow-alpha: 0.20;
			--grid-bg: rgba(255, 255, 255, 0.72);
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: 'Montserrat', sans-serif;
			background: radial-gradient(circle at 12% 8%, var(--page-bg-1) 0%, var(--page-bg-2) 36%, var(--page-bg-3) 100%);
			color: var(--team-texto);
			min-height: 100vh;
			padding: 24px;
		}

		.page-wrap {
			width: min(1200px, 100%);
			margin: 0 auto;
		}

		.toolbar {
			display: flex;
			flex-wrap: wrap;
			gap: 12px;
			align-items: center;
			justify-content: center;
			margin-bottom: 18px;
		}

		.toolbar label {
			font-weight: 700;
			color: var(--team-azul);
			font-size: 14px;
			letter-spacing: .04em;
			text-transform: uppercase;
		}

		.range-sep {
			font-weight: 800;
			color: var(--team-azul);
			font-size: 14px;
		}

		.toolbar select,
		.toolbar button {
			border: 0;
			border-radius: 10px;
			padding: 10px 14px;
			font-family: inherit;
			font-weight: 700;
			font-size: 14px;
		}

		.toolbar select {
			background: #ffffff;
			color: var(--team-azul);
			box-shadow: 0 4px 16px rgba(31, 75, 112, 0.14);
			min-width: 180px;
		}

		.toolbar button {
			background: var(--team-coral);
			color: white;
			cursor: pointer;
			box-shadow: 0 8px 18px rgba(255, 107, 95, 0.24);
			transition: transform .2s ease, box-shadow .2s ease;
		}

		.toolbar button:hover {
			transform: translateY(-1px);
			box-shadow: 0 12px 24px rgba(255, 107, 95, 0.28);
		}

		.message-controls {
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
			justify-content: center;
			align-items: center;
			margin: 0 auto 18px;
			max-width: 980px;
		}

		.message-controls select,
		.message-controls textarea {
			font-family: inherit;
			border-radius: 10px;
			border: 1px solid rgba(31, 75, 112, 0.26);
			padding: 10px 12px;
			box-shadow: 0 4px 12px rgba(31, 75, 112, 0.08);
		}

		.message-controls select {
			min-width: 280px;
			font-weight: 600;
			color: var(--team-azul);
		}

		.message-controls textarea {
			width: min(760px, 100%);
			resize: vertical;
			min-height: 76px;
			font-size: 14px;
			line-height: 1.35;
		}

		.status {
			text-align: center;
			margin: 0 0 18px;
			color: var(--team-azul);
			font-weight: 600;
			min-height: 26px;
		}

		.poster {
			width: min(1024px, 100%);
			margin: 0 auto;
			background: linear-gradient(160deg, var(--poster-start) 0%, var(--poster-end) 100%);
			border-radius: 32px;
			overflow: hidden;
			border: 2px solid rgba(31, 75, 112, 0.16);
			box-shadow: 0 20px 40px rgba(37, 33, 58, 0.16);
			position: relative;
		}

		.poster::before,
		.poster::after {
			content: "";
			position: absolute;
			pointer-events: none;
			z-index: 1;
			width: 190px;
			height: 190px;
			background: radial-gradient(circle at 60% 40%, rgba(var(--poster-glow-rgb), var(--poster-glow-alpha)) 0%, rgba(var(--poster-glow-rgb), 0) 70%);
		}

		.poster::before {
			top: -45px;
			left: -40px;
		}

		.poster::after {
			bottom: -45px;
			right: -40px;
		}

		.poster-header {
			position: relative;
			z-index: 2;
			padding: 38px 34px 22px;
			text-align: center;
		}

		.month-pill {
			display: inline-block;
			border: 2px solid rgba(31, 75, 112, 0.4);
			border-radius: 16px;
			padding: 10px 26px;
			font-size: 46px;
			line-height: 1;
			font-weight: 500;
			color: #151520;
			margin-bottom: 18px;
			text-transform: uppercase;
			letter-spacing: .04em;
			background: white;
		}

		.headline {
			line-height: .94;
			margin-bottom: 10px;
		}

		.headline .line-strong {
			display: block;
			font-size: 78px;
			font-weight: 900;
			color: #1f1f26;
		}

		.headline .line-regular {
			display: block;
			font-size: 38px;
			font-weight: 800;
			color: #202028;
		}

		.brand-mini {
			font-size: 15px;
			letter-spacing: .26em;
			color: #515161;
			margin-bottom: 8px;
		}

		.grid-wrap {
			position: relative;
			z-index: 2;
			margin: 0 24px;
			border: 1px solid rgba(31, 75, 112, 0.28);
			border-radius: 28px;
			padding: 26px 20px 16px;
			background: var(--grid-bg);
			backdrop-filter: blur(2px);
		}

		.birthday-grid {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 14px 12px;
		}

		.birthday-card {
			position: relative;
			text-align: center;
			flex: 0 1 calc((100% - 24px) / 3);
			max-width: 220px;
			min-height: 200px;
		}

		.birthday-grid.few-1 .birthday-card {
			flex-basis: 420px;
			max-width: 420px;
		}

		.birthday-grid.few-2 .birthday-card {
			flex-basis: 330px;
			max-width: 330px;
		}

		.birthday-grid.few-3 .birthday-card {
			flex-basis: 280px;
			max-width: 280px;
		}

		.birthday-grid.few-4 .birthday-card {
			flex-basis: calc((100% - 12px) / 2);
			max-width: 300px;
		}

		.birthday-day-bg {
			position: absolute;
			top: 16px;
			left: 50%;
			transform: translateX(-50%);
			font-size: 100px;
			font-weight: 900;
			color: rgba(40, 40, 48, 0.08);
			z-index: 1;
			line-height: 1;
			letter-spacing: -0.06em;
			pointer-events: none;
		}

		.avatar {
			width: 118px;
			height: 118px;
			border-radius: 18px;
			object-fit: cover;
			position: relative;
			z-index: 2;
			margin-top: 18px;
			box-shadow: 0 10px 20px rgba(0, 0, 0, 0.16);
			border: 2px solid #fff;
		}


        .card-date {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            right: 20px;
			top: 5px;
            flex-direction: column;

        }
		.day-chip {
			position: relative;
			z-index: 3;
			font-size: 44px;
			font-weight: 900;
			color: var(--team-coral);
			text-shadow: -2px -2px 0 white, 2px -2px 0 white, -2px 2px 0 white, 2px 2px 0 white;
			line-height: 1;
		}
        .card-month {
			position: relative;
			z-index: 3;
			font-size: 1.2rem;
			font-weight: 900;
			color: var(--team-menta);
			text-shadow: -2px -2px 0 white, 2px -2px 0 white, -2px 2px 0 white, 2px 2px 0 white;
			line-height: 1;
		}

 
		.name {
			margin-top: 8px;
			position: relative;
			z-index: 3;
			font-size: 20px;
			font-weight: 900;
			text-transform: uppercase;
			line-height: 1.04;
			color: #171720;
			letter-spacing: .01em;
		}

		.poster-footer {
			position: relative;
			z-index: 2;
			text-align: center;
			padding: 22px 28px 34px;
		}

		.poster-copy {
			color: #2b2b38;
			font-size: 1.5rem;
			line-height: 1.08;
			margin-bottom: 18px;
			font-weight: 500;
		}

		.poster-copy strong {
			color: var(--team-coral);
		}

		.logo-block img {
			width: 160px;
			max-width: 100%;
			display: inline-block;
		}

		.empty-state {
			text-align: center;
			padding: 40px 16px;
			color: #5a5a66;
			font-weight: 600;
			font-size: 18px;
		}

		@media (max-width: 860px) {
			body {
				padding: 14px;
			}

			.poster-header {
				padding: 24px 16px 16px;
			}

			.month-pill {
				font-size: 34px;
				border-radius: 12px;
				padding: 8px 20px;
			}

			.headline .line-strong {
				font-size: 48px;
			}

			.headline .line-regular {
				font-size: 26px;
			}

			.brand-mini {
				font-size: 12px;
				letter-spacing: .18em;
			}

			.grid-wrap {
				margin: 0 10px;
				padding: 16px 10px 10px;
				border-radius: 20px;
			}

			.birthday-grid {
				gap: 14px 10px;
			}

			.birthday-card {
				flex-basis: calc((100% - 10px) / 2);
				max-width: 250px;
				min-height: 182px;
			}

			.birthday-grid.few-1 .birthday-card,
			.birthday-grid.few-2 .birthday-card,
			.birthday-grid.few-3 .birthday-card,
			.birthday-grid.few-4 .birthday-card {
				flex-basis: calc((100% - 10px) / 2);
				max-width: 250px;
			}

			.birthday-day-bg {
				font-size: 82px;
				top: 20px;
			}

			.avatar {
				width: 98px;
				height: 98px;
				border-radius: 14px;
			}

			.day-chip {
				font-size: 34px;
				top: 102px;
				right: 4px;
			}

			.name {
				font-size: 15px;
			}

			.poster-copy {
				font-size: 24px;
			}
		}

		@media (max-width: 520px) {
			.birthday-grid {
				gap: 12px;
			}

			.birthday-card {
				flex-basis: 100%;
				max-width: 320px;
				min-height: 168px;
			}

			.birthday-day-bg {
				font-size: 78px;
				top: 24px;
			}

			.day-chip {
				top: 96px;
			}
		}
	</style>
</head>
<body>
	<div class="page-wrap">
		<div class="toolbar">
			<label for="mes-desde">Meses</label>
			<select id="mes-desde"></select>
			<span class="range-sep">a</span>
			<select id="mes-hasta"></select>
			<label for="tema-fondo">Fondo</label>
			<select id="tema-fondo">
				<option value="neutro">Neutro</option>
				<option value="azul">Azul oficina</option>
				<option value="coral">Coral alegre</option>
				<option value="menta">Menta suave</option>
			</select>
			<button id="btn-descargar" type="button">Descargar rango en PNG</button>
		</div>

		<div class="message-controls">
			<label for="mensaje-select">Mensaje</label>
			<select id="mensaje-select">
				<option value="actual">Cumple del equipo</option>
				<option value="energia">Gracias por tu energia</option>
				<option value="equipo">Gracias por ser parte del equipo</option>
				<option value="impacto">Celebramos tu impacto</option>
				<option value="custom">Personalizado</option>
			</select>
			<textarea id="mensaje-custom" placeholder="Escribe tu mensaje personalizado" hidden></textarea>
		</div>

		<p class="status" id="status">Cargando cumples...</p>

		<section class="poster" id="poster">
			<header class="poster-header">
				<div class="month-pill" id="month-pill">ENERO</div>
				<h1 class="headline">
					<span class="line-strong">Feliz</span>
					<span class="line-regular">Cumpleaños</span>
				</h1>
			</header>

			<div class="grid-wrap">
				<div class="birthday-grid" id="birthday-grid"></div>
				<div class="empty-state" id="empty-state" hidden>No hay cumpleaños registrados para este mes.</div>
			</div>

			<footer class="poster-footer">
				<p class="poster-copy" id="poster-copy"></p>
			</footer>
		</section>
	</div>

	<script>
		const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzA0pHkUbfCzzWBjfG-jpzALSB8aAmLJGPFhE6bhI5AbTM_xNgwOcOK8MfVzY89CBAa/exec';

		const MONTHS = [
			'enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
			'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'
		];

		const statusEl = document.getElementById('status');
		const monthFromSelect = document.getElementById('mes-desde');
		const monthToSelect = document.getElementById('mes-hasta');
		const monthPill = document.getElementById('month-pill');
		const gridEl = document.getElementById('birthday-grid');
		const emptyEl = document.getElementById('empty-state');
		const themeSelect = document.getElementById('tema-fondo');
		const messageSelect = document.getElementById('mensaje-select');
		const customMessageInput = document.getElementById('mensaje-custom');
		const posterCopyEl = document.getElementById('poster-copy');
		const downloadBtn = document.getElementById('btn-descargar');

		let equipoCumples = [];

		const THEMES = {
			neutro: {
				page1: '#fffdf9',
				page2: '#f7f8fc',
				page3: '#eef2f8',
				posterStart: '#fffefc',
				posterEnd: '#f9fbff',
				glowRgb: '47, 191, 159',
				glowAlpha: '0.18',
				gridBg: 'rgba(255, 255, 255, 0.72)'
			},
			azul: {
				page1: '#fcfdff',
				page2: '#f2f7fe',
				page3: '#e7eff9',
				posterStart: '#ffffff',
				posterEnd: '#f6faff',
				glowRgb: '31, 75, 112',
				glowAlpha: '0.14',
				gridBg: 'rgba(255, 255, 255, 0.74)'
			},
			coral: {
				page1: '#fffdfb',
				page2: '#fff4f1',
				page3: '#ffebe8',
				posterStart: '#ffffff',
				posterEnd: '#fff9f8',
				glowRgb: '255, 107, 95',
				glowAlpha: '0.12',
				gridBg: 'rgba(255, 255, 255, 0.74)'
			},
			menta: {
				page1: '#fcfffd',
				page2: '#f1fbf8',
				page3: '#e7f6f1',
				posterStart: '#ffffff',
				posterEnd: '#f8fffc',
				glowRgb: '47, 191, 159',
				glowAlpha: '0.16',
				gridBg: 'rgba(255, 255, 255, 0.74)'
			}
		};

		const MESSAGE_PRESETS = {
			actual: 'Un reconocimiento especial a quienes celebraron su cumpleanos en estos meses.\n¡Gracias por su energia y buena onda en el trabajo!',
			energia: 'Tu energia positiva hace mejor cada dia de trabajo. ¡Feliz cumpleanos!',
			equipo: 'Gracias por ser parte del equipo. Celebramos tu cumple y todo lo que aportas.',
			impacto: 'Celebramos tu impacto, tu actitud y tu compania en este equipo. ¡Feliz vuelta al sol!'
		};

		const quitarTildes = (txt = '') => txt
			.normalize('NFD')
			.replace(/[\u0300-\u036f]/g, '')
			.toLowerCase()
			.trim();

		const limpiarNombre = (nombre = '') => String(nombre)
			.replace(/\s+/g, ' ')
			.trim();

		function getValueByKey(row, posiblesLlaves) {
			const keys = Object.keys(row);
			const match = keys.find((k) => {
				const keyNorm = quitarTildes(k);
				return posiblesLlaves.some((candidate) => keyNorm === candidate || keyNorm.includes(candidate));
			});
			return match ? row[match] : '';
		}

		function mesTextoANumero(textoMes) {
			const m = quitarTildes(textoMes);
			if (!m) return null;
			const idx = MONTHS.findIndex((mes) => mes.startsWith(m) || m.startsWith(mes));
			return idx >= 0 ? idx + 1 : null;
		}

		function parseCumple(rawValue) {
			if (!rawValue && rawValue !== 0) return null;
			const value = String(rawValue).trim();
			if (!value) return null;

			// Soporta ISO datetime sin depender de Date para evitar corrimientos de zona horaria.
			const isoDateTimeMatch = value.match(/^(\d{4})-(\d{1,2})-(\d{1,2})T/);
			if (isoDateTimeMatch) {
				const mes = Number(isoDateTimeMatch[2]);
				const dia = Number(isoDateTimeMatch[3]);
				if (mes >= 1 && mes <= 12 && dia >= 1 && dia <= 31) return { dia, mes };
			}

			const isoMatch = value.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);
			if (isoMatch) {
				const mes = Number(isoMatch[2]);
				const dia = Number(isoMatch[3]);
				if (mes >= 1 && mes <= 12 && dia >= 1 && dia <= 31) return { dia, mes };
			}

			const latinNumeric = value.match(/^(\d{1,2})[-\/](\d{1,2})(?:[-\/](\d{2,4}))?$/);
			if (latinNumeric) {
				const dia = Number(latinNumeric[1]);
				const mes = Number(latinNumeric[2]);
				if (mes >= 1 && mes <= 12 && dia >= 1 && dia <= 31) return { dia, mes };
			}

			const dayTextMonth = value.match(/^(\d{1,2})\s*(?:de)?\s*([a-zA-ZáéíóúÁÉÍÓÚñÑ]+)$/);
			if (dayTextMonth) {
				const dia = Number(dayTextMonth[1]);
				const mes = mesTextoANumero(dayTextMonth[2]);
				if (mes && dia >= 1 && dia <= 31) return { dia, mes };
			}

			const textMonthDay = value.match(/^([a-zA-ZáéíóúÁÉÍÓÚñÑ]+)\s*(\d{1,2})$/);
			if (textMonthDay) {
				const mes = mesTextoANumero(textMonthDay[1]);
				const dia = Number(textMonthDay[2]);
				if (mes && dia >= 1 && dia <= 31) return { dia, mes };
			}

			return null;
		}

		function resolverFoto(fotoRaw) {
			const fallback = 'tarjetas/assets/fotos/placeholder.jpg';
			const foto = String(fotoRaw || '').trim();
			if (!foto) return { src: fallback, base: '' };

			if (/^https?:\/\//i.test(foto)) return { src: foto, base: '' };

			const clean = foto.replace(/^\.?\//, '');
			const hasExtension = /\.[a-z0-9]{2,5}$/i.test(clean);

			if (clean.includes('/')) {
				if (hasExtension) return { src: clean, base: '' };
				return { src: `${clean}.jpg`, base: clean };
			}

			const base = `tarjetas/assets/fotos/${clean}`;
			if (hasExtension) return { src: base, base: '' };
			return { src: `${base}.jpg`, base };
		}

		function handlePhotoError(img) {
			const base = img.dataset.base || '';
			const tried = img.dataset.tried || '';

			if (base && tried !== 'png') {
				img.dataset.tried = 'png';
				img.src = `${base}.png`;
				return;
			}

			if (base && tried === 'png') {
				img.dataset.tried = 'webp';
				img.src = `${base}.webp`;
				return;
			}

			img.onerror = null;
			img.src = 'tarjetas/assets/fotos/placeholder.png';
		}

		function normalizarRegistro(row) {
			const nombre = getValueByKey(row, ['nombre', 'colaborador', 'persona', 'empleado']);
			const foto = getValueByKey(row, ['foto', 'fotos', 'imagen']);
			const cumple = getValueByKey(row, ['fecha', 'cumple', 'cumpleanos', 'cumpleaños', 'fecha cumpleaños', 'fecha cumple', 'birthday']);

			const fechaCumple = parseCumple(cumple);
			if (!fechaCumple || !nombre) return null;

			const fotoResuelta = resolverFoto(foto);

			return {
				nombre: limpiarNombre(nombre),
				foto: fotoResuelta.src,
				fotoBase: fotoResuelta.base,
				dia: fechaCumple.dia,
				mes: fechaCumple.mes
			};
		}

		function getMesesEnRango(mesDesde, mesHasta) {
			if (mesDesde <= mesHasta) {
				return MONTHS.map((_, idx) => idx + 1).filter((n) => n >= mesDesde && n <= mesHasta);
			}

			// Permite rangos que cruzan fin de año, por ejemplo noviembre a febrero.
			return MONTHS.map((_, idx) => idx + 1).filter((n) => n >= mesDesde || n <= mesHasta);
		}

		function getTituloRango(mesDesde, mesHasta) {
			const desde = MONTHS[mesDesde - 1] || '';
			const hasta = MONTHS[mesHasta - 1] || '';
			if (mesDesde === mesHasta) return desde.toUpperCase();
			return `${desde.toUpperCase()} - ${hasta.toUpperCase()}`;
		}

		function actualizarClaseCantidad(total) {
			gridEl.classList.remove('few-1', 'few-2', 'few-3', 'few-4');
			if (total >= 1 && total <= 4) {
				gridEl.classList.add(`few-${total}`);
			}
		}

		function aplicarTema(nombreTema) {
			const tema = THEMES[nombreTema] || THEMES.neutro;
			document.documentElement.style.setProperty('--page-bg-1', tema.page1);
			document.documentElement.style.setProperty('--page-bg-2', tema.page2);
			document.documentElement.style.setProperty('--page-bg-3', tema.page3);
			document.documentElement.style.setProperty('--poster-start', tema.posterStart);
			document.documentElement.style.setProperty('--poster-end', tema.posterEnd);
			document.documentElement.style.setProperty('--poster-glow-rgb', tema.glowRgb);
			document.documentElement.style.setProperty('--poster-glow-alpha', tema.glowAlpha);
			document.documentElement.style.setProperty('--grid-bg', tema.gridBg);
		}

		function escapeHtml(value) {
			return String(value)
				.replace(/&/g, '&amp;')
				.replace(/</g, '&lt;')
				.replace(/>/g, '&gt;')
				.replace(/"/g, '&quot;')
				.replace(/'/g, '&#39;');
		}

		function actualizarMensaje() {
			const selected = messageSelect.value;
			const isCustom = selected === 'custom';
			customMessageInput.hidden = !isCustom;

			const rawMessage = isCustom
				? (customMessageInput.value || 'Escribe tu mensaje personalizado para el equipo.')
				: (MESSAGE_PRESETS[selected] || MESSAGE_PRESETS.actual);

			const safeMessage = escapeHtml(rawMessage).replace(/\n/g, '<br>');
			posterCopyEl.innerHTML = safeMessage;
		}

		function renderRango(mesDesde, mesHasta) {
			const mesesIncluidos = getMesesEnRango(mesDesde, mesHasta);
			const tituloRango = getTituloRango(mesDesde, mesHasta);
			monthPill.textContent = tituloRango;

			const items = equipoCumples
				.filter((m) => mesesIncluidos.includes(m.mes))
				.sort((a, b) => a.mes - b.mes || a.dia - b.dia || a.nombre.localeCompare(b.nombre, 'es'));

			gridEl.innerHTML = '';

			if (!items.length) {
				emptyEl.hidden = false;
				actualizarClaseCantidad(0);
				statusEl.textContent = `No se encontraron cumpleaños para ${tituloRango.toLowerCase()}.`;
				return;
			}

			emptyEl.hidden = true;
			actualizarClaseCantidad(items.length);
			statusEl.textContent = `${items.length} cumpleanos para ${tituloRango.toLowerCase()}.`;

			const esRangoMultiple = mesDesde !== mesHasta;

			items.forEach((item) => {
				const card = document.createElement('article');
				card.className = 'birthday-card';
				
				let mesAbbrHtml = '';
				if (esRangoMultiple) {
					const mesAbbr = MONTHS[item.mes - 1].substring(0, 3);
					mesAbbrHtml = `<span class="card-month">${mesAbbr}</span>`;
				}

				card.innerHTML = `
					<div class="card-photo">
						<img class="avatar" src="${item.foto}" data-base="${item.fotoBase || ''}" alt="${item.nombre}" loading="lazy" onerror="handlePhotoError(this)">
						<div class="card-date">
							<span class="day-chip">${item.dia}</span>
							${mesAbbrHtml}
						</div>
					</div>
					<h3 class="name">${item.nombre}</h3>
				`;
				gridEl.appendChild(card);
			});
		}

		function inicializarMeses() {
			const options = MONTHS
				.map((mes, idx) => `<option value="${idx + 1}">${mes.charAt(0).toUpperCase() + mes.slice(1)}</option>`)
				.join('');

			monthFromSelect.innerHTML = options;
			monthToSelect.innerHTML = options;

			const mesActual = new Date().getMonth() + 1;
			monthFromSelect.value = '1';
			monthToSelect.value = String(mesActual);
			renderRango(Number(monthFromSelect.value), Number(monthToSelect.value));
		}

		async function cargarCumplesEquipo() {
    try {
        statusEl.textContent = 'Cargando cumpleaños del equipo desde Google Sheets...';
        
        // Se añade redirect: 'follow' para manejar las redirecciones internas de Google
        const response = await fetch(`${SCRIPT_URL}?t=${Date.now()}`, {
            method: 'GET',
            redirect: 'follow'
        });

        if (!response.ok) {
            throw new Error(`Error en la petición: ${response.status} ${response.statusText}`);
        }

        const data = await response.json();
        if (!Array.isArray(data)) {
            throw new Error('La respuesta de la hoja no es un listado válido.');
        }

        equipoCumples = data
            .map(normalizarRegistro)
            .filter(Boolean);

        if (!equipoCumples.length) {
            statusEl.textContent = 'No hay registros con columna fecha/cumple válida. Revisa los nombres de las cabeceras.';
            inicializarMeses();
            return;
        }

        inicializarMeses();
    } catch (error) {
        console.error('Error detallado:', error);
        statusEl.textContent = 'Error cargando datos. Revisa la consola para más detalles o verifica la implementación de Apps Script.';
    }
}
		monthFromSelect.addEventListener('change', () => {
			renderRango(Number(monthFromSelect.value), Number(monthToSelect.value));
		});

		monthToSelect.addEventListener('change', () => {
			renderRango(Number(monthFromSelect.value), Number(monthToSelect.value));
		});

		themeSelect.addEventListener('change', () => {
			aplicarTema(themeSelect.value);
		});

		messageSelect.addEventListener('change', () => {
			actualizarMensaje();
		});

		customMessageInput.addEventListener('input', () => {
			if (messageSelect.value === 'custom') {
				actualizarMensaje();
			}
		});

		downloadBtn.addEventListener('click', async () => {
			const poster = document.getElementById('poster');

			downloadBtn.disabled = true;
			downloadBtn.textContent = 'Generando PNG...';

			try {
				const mesDesde = Number(monthFromSelect.value);
				const mesHasta = Number(monthToSelect.value);
				const etiquetaRango = getTituloRango(mesDesde, mesHasta).toLowerCase().replace(/\s+/g, '_');

				await document.fonts.ready;
				const canvas = await html2canvas(poster, {
					scale: 2.6,
					useCORS: true,
					allowTaint: true,
					backgroundColor: '#ffffff'
				});

				const link = document.createElement('a');
				link.download = `cumple_team_${etiquetaRango}.png`;
				link.href = canvas.toDataURL('image/png');
				link.click();
			} catch (error) {
				console.error(error);
				statusEl.textContent = 'No se pudo generar el PNG. Revisa que las imágenes estén accesibles.';
			} finally {
				downloadBtn.disabled = false;
				downloadBtn.textContent = 'Descargar rango en PNG';
			}
		});

		cargarCumplesEquipo();
		aplicarTema('neutro');
		actualizarMensaje();
	</script>
</body>
</html>
