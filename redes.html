<!DOCTYPE html>
<html lang="es">
<head>

    <title>Mujeres Rompiendo Barreras</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://kit.fontawesome.com/bfe8a34919.js" crossorigin="anonymous"></script>
</head>
<body class="redes">
    <main>
        
<div class="link">
    <!-- Enlace de Instagram -->
    <a href="instagram://user?username=mujeresrompiendobarreras1" target="_blank" onclick="openInAppOrBrowser(event, 'https://www.instagram.com/mujeresrompiendobarreras1')">
        <i class="fa-brands fa-instagram"></i>
        <h3>Instagram</h3>
    </a>
    </div>
    <div class="link central">
    <!-- Enlace de Facebook -->
    <a href="fb://page/?id=MRBarreras" target="_blank" onclick="openInAppOrBrowser(event, 'https://www.facebook.com/MRBarreras')">

    </a>

    <script>
        function openInAppOrBrowser(event, url) {
            event.preventDefault(); // Evita que se abra el enlace directamente

        }
    </script>
